name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Validate every CSV against its declared schema
        run: python -m backendpro.scripts.validate

      - name: Run pytest with coverage
        run: pytest --cov=src/backend-pro-max --cov-report=term-missing

      - name: CLI smoke test
        run: |
          backendpro --list
          backendpro "circuit breaker" -n 2
          backendpro compare "Kafka" "RabbitMQ" --domain messaging
          backendpro "idempotency" --all

  mcp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install MCP test dependencies
        run: python -m pip install -e ".[dev,mcp]"
      - name: Verify MCP tools
        run: python -m pytest tests/test_mcp_server.py

  wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test clean installed wheel
        run: python scripts/smoke_wheel.py dist/backendpro-*.whl

  retrieval-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install retrieval test dependencies
        run: python -m pip install -e ".[dev,semantic,rerank]"
      - name: Verify real retrieval models and fallback behavior
        run: python -m pytest tests/test_semantic.py tests/test_rerank.py
      - name: Measure retrieval quality and warm latency
        run: python -m backendpro.scripts.benchmark tests/retrieval-benchmark.json --output retrieval-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: retrieval-benchmark.json
