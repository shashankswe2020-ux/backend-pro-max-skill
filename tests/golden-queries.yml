# Golden Query Test Suite — guards BM25 retrieval quality.
# Each entry asserts that the given query returns at least one of the
# `expected_top` values in the top-N results (matched against the first
# column of the result, case-insensitive substring).
#
# Format:
#   - query: "<search text>"
#     domain: <domain>          # or stack: <stack> or mode: all|compare
#     expected_top: ["<Name>"]  # any of these in top-N is a pass
#     min_score: <float>        # optional — top hit must score >= this
#     top_n: <int>              # optional, default 5
#     notes: "<why this matters>"

